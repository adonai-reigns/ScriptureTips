packages:
  - apps/*
  - packages/*
  - tools/*

# Dependencies whose install scripts may run: native modules compiled in the toolbox.
allowBuilds:
  tree-sitter: true
  tree-sitter-usfm3: true
  # Through drizzle-kit. Its install script only checks the binary, which esbuild's platform
  # package already provides.
  esbuild: false
  # Through next-intl's tooling. Their install scripts only build from source when no
  # prebuilt platform package is found, and one is.
  "@parcel/watcher": false
  "@swc/core": false
